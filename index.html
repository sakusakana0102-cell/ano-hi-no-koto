<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あの日のこと</title>

<style>
* {
    box-sizing: border-box;
}

html {
    background: #f5f6f7;
}

body {
    margin: 0;
    padding: 0 20px 60px;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
    color: #333;
    line-height: 1.9;
    background: #f5f6f7;
}

#app {
    width: 100%;
}


/* ===== ブログのヘッダー ===== */

.blog-header {
    max-width: none;
    margin: 0;
    padding: 30px 40px 20px;
    text-align: left;
    background: #c5e4f0;
}

.blog-header.gray-header {
    background: #d4d4d4;
}

.blog-title {
    margin: 0;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #222;
}

.blog-description {
    margin: 8px 0 0;
    font-size: 13px;
    line-height: 1.7;
    color: #7a8188;
}

/* ===== ブログ本文 ===== */

.blog-main {
    max-width: 720px;
    margin: 0 auto;
}

.home-article {
    width: 100%;
    margin: 42px 0 0;
}

.home-article .result-button {
    width: 100%;
    margin: 12px 0;
}

.home-page {
    padding: 42px 0 0;
}

.article {
    margin: 0;
    padding: 48px 0 45px;
    border-bottom: 1px solid #dfe3e6;
}

.article-date {
    margin-bottom: 8px;
    font-size: 13px;
    color: #8a9198;
    letter-spacing: 0.04em;
}

.article-title {
    margin: 0 0 28px;
    font-size: 28px;
    font-weight: 400;
    line-height: 1.5;
    color: #222;
}

.article-body {
    font-size: 16px;
    min-height: 80px;
    color: #3d4247;
}

.article-image {
    display: block;
    width: 100%;
    max-width: 720px;
    height: auto;
    margin: 28px auto;
}

.article-video {
    display: block;
    width: 100%;
    max-width: 720px;
    margin: 28px auto;
    background: #000;
}

/* ===== 検索 ===== */

.search-area {
    position: absolute;
    top: 30px;
    right: 40px;
    width: 300px;
    margin: 0;
    padding: 15px 20px;
    background: #d6edf7;
    border-top: none;
}


.search-label {
    margin-bottom: 12px;
    font-size: 12px;
    color: #888f96;
    letter-spacing: 0.08em;
}

.search-form {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 11px 13px;
    border: 1px solid #cfd4d8;
    border-radius: 2px;
    background: #fff;
    color: #333;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #7c9bb8;
}

button {
    padding: 10px 18px;
    border: 1px solid #9aa8b5;
    border-radius: 2px;
    background: #fff;
    color: #4d6f8d;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    background: #f0f4f7;
}

/* ===== 検索結果 ===== */

.results-page {
    padding: 42px 0 0;
}

.results-heading {
    margin: 0 0 30px;
    font-size: 24px;
    font-weight: 400;
}

.result-title {
    margin: 0 0 12px;
    font-size: 13px;
    color: #888f96;
}

.result-button {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin: 12px 0;
    padding: 15px 18px;
    background: #fff;
    border: 1px solid #cfd4d8;
    border-radius: 2px;
    color: #47769e;
    font-size: 16px;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
}

.result-button:hover {
    background: #f5f7f8;
    color: #315c80;
}

.result-date {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    color: #969da3;
}

.message {
    margin-top: 25px;
    color: #777;
}

/* ===== 下部 ===== */

.blog-footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 25px 0 0;
    text-align: right;
    font-size: 12px;
    color: #999;
}

.back-link {
    display: inline-block;
    margin-top: 25px;
    color: #47769e;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
}

.back-link:hover {
    text-decoration: underline;
}

.article-meta {
    margin-top: 32px;
    text-align: right;
    font-size: 12px;
    color: #999;
}

/* ===== スマートフォン ===== */
@media screen and (max-width: 600px) {
    body {
        padding: 0 16px 45px;
    }

    .blog-header {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        position: relative;
        height: auto;
        min-height: 0;
        padding: 25px 16px 20px;
    }

    .blog-title {
        display: block;
        position: static;
        margin: 0;
        font-size: 27px;
    }

    .blog-description {
        display: block;
        position: static;
        margin: 8px 0 0;
        font-size: 13px;
    }

    .search-area {
        display: block;
        position: static;
        width: 100%;
        margin: 25px 0 0;
        padding: 15px 0;
    }

    .search-form {
        display: flex;
        width: 100%;
    }

    .article {
        padding: 35px 0;
    }

    .article-title {
        font-size: 24px;
    }

    .article-body {
        font-size: 15px;
    }

    button {
        padding-left: 14px;
        padding-right: 14px;
    }
}


#password-screen {

#password-screen p {

    font-size: 15px;
    line-height: 1.2;
    outline: none;

#password-input:focus {

#password-screen button {
    padding: 10px 24px;
    border: none;
    background: #333;
    color: white;
    cursor: pointer;
}

#password-error {
    color: #c00;
}

</style>
</head>

/* =========================
   // を改行に変換
========================= */

function formatBody(text) {
    return text
        .split("//")
        .map(part => {
            if (part === "") {
                return "<br>";
            }

            return part
                .replace(/\[IMAGE:([^\]]+)\]/g, (_, src) =>
                    `<img src="${src}" class="article-image" alt="">`
                )
                .replace(/\[VIDEO:([^\]]+)\]/g, (_, src) =>
                    `
                    <video class="article-video" controls playsinline preload="metadata">
                        <source src="${src}">
                        動画を再生できません。
                    </video>
                    `
                );
        })
        .join("<br>");
}


/* =========================
   No番号を作る
========================= */

function getArticleNumber(index) {

    const article = articles[index];

    if (article.type === "日記") {

        const number =
            articles
                .slice(0, index + 1)
                .filter(a => a.type === "日記")
                .length;

        return "No" + number + "/No22";
    }

    if (article.type === "思い出") {

        const number =
            articles
                .slice(0, index + 1)
                .filter(a => a.type === "思い出")
                .length;

        return "No" + number + "/No20";
    }

    return "";
}

/* ========================= 
   最初の画面 
========================= */ 
function showHome() {
    document.getElementById("app").innerHTML = `
        <header class="blog-header">
            <h1 class="blog-title">あの日のこと</h1>
            <p class="blog-description">
                忘れたくないこと、<br>
                思い出したいこと、<br>
                そして、日々のこと。
            </p>

            <div class="search-area">
                <div class="search-label">SEARCH</div>
                <div class="search-form">
                    <input type="text" id="searchBox" placeholder="キーワードを入力">
                    <button onclick="search()">検索</button>
                </div>
            </div>
        </header>

        <main class="blog-main">
            <div class="home-article">
                <button class="result-button" onclick="showArticle(0)">
                    <div class="article-date">2026.09.16</div>
                    <div class="article-title">日記：起床</div>
                </button>
            </div>
        </main>
    `;

    document.getElementById("searchBox").addEventListener("keydown", function(event) {
        if (event.key === "Enter") search();
    });
}

 
function search() { 
 
    const word = 
        document 
            .getElementById("searchBox") 
            .value 
            .trim(); 
 
    lastSearchWord = word; 
 
    if (!word) { 
 
        showResults(word, []); 
 
        return; 
    } 
 
    const matches = 
        articles.filter(article => 
            article.keywords.includes(word) 
        ); 
 
    showResults(word, matches); 
}

/* =========================
   検索結果
========================= */

function showResults(word, matches) {

    const grayWords = [
        "更新",
        "9/18",
        "diary/20260916-morning-old",
        "千葉大",
        "就職"
    ];

    const headerClass = grayWords.includes(word)
        ? "blog-header gray-header"
        : "blog-header";

    let html = `
        <header class="${headerClass}">
            <h1 class="blog-title">あの日のこと</h1>
            <p class="blog-description">
                忘れたくないこと、<br>
                思い出したいこと、<br>
                そして、日々のこと。
            </p>
        </header>

        <main class="blog-main">
            <div class="results-page">
                <h2 class="results-heading">検索結果</h2>
    `;

    if (!word) {
        html += `<p class="message">検索する言葉を入力してください。</p>`;
    } else if (matches.length === 0) {
        html += `<p class="message">「${word}」は見つかりませんでした。</p>`;
    } else {
        html += `<p class="result-title">「${word}」の検索結果</p>`;

        matches.forEach(article => {
            const index = articles.indexOf(article);
            const date = article.type === "日記" ? "2026.09.16" : "";

            html += `
                <button class="result-button" onclick="showArticle(${index})">
                    ${article.title}
                    ${date ? `<span class="result-date">${date}</span>` : ""}
                </button>
            `;
        });
    }

    html += `
            </div>
            <a class="back-link" onclick="showHome()">← ブログに戻る</a>
        </main>

       
    `;

    document.getElementById("app").innerHTML = html;
}

function showArticle(index) {
    const article = articles[index];

    const date =
        article.title === "日記：起床"
            ? "2026.09.16更新"
            : article.type === "日記"
                ? "2026.09.16"
                : "";

    const grayWords = [
        "更新",
        "9/18",
        "diary/20260916-morning-old",
        "千葉大",
        "就職"
    ];

    const grayArticle =
        article.keywords.some(keyword =>
            grayWords.includes(keyword)
        );

    const headerClass = grayArticle
        ? "blog-header gray-header"
        : "blog-header";

    document.getElementById("app").innerHTML = `
        <header class="${headerClass}">
            <h1 class="blog-title">あの日のこと</h1>
            <p class="blog-description">
                忘れたくないこと、<br>
                思い出したいこと、<br>
                そして、日々のこと。
            </p>
        </header>

        <main class="blog-main">
            <article class="article">
                ${date ? `<div class="article-date">${date}</div>` : ""}
                <h2 class="article-title">${article.title}</h2>

                <div class="article-body">
                    ${formatBody(article.body)}
                </div>
<div class="article-meta">${getArticleNumber(index)}</div>
            </article>

            <a class="back-link" onclick="returnToSearch()">← 検索結果に戻る</a>
        </main>

       
    `;
}

function returnToSearch() {

    if (lastSearchWord !== null) {

        const matches =
            articles.filter(article =>
                article.keywords.includes(lastSearchWord)
            );

        showResults(
            lastSearchWord,
            matches
        );

    } else {

        showHome();

    }
}
